<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clueworthy</title>
  <meta name="description" content="Learn and solve cryptic crossword clues, one at a time. Works offline.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clueworthy">
  <script>
    // Apply the saved theme before first paint (tiny plain cookie written by js/store.js).
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)cq_v1_ui=([a-z]+),([01])/);
      if (!m) return;
      if (m[1] === 'light' || m[1] === 'dark') document.documentElement.dataset.theme = m[1];
      if (m[2] === '1') document.documentElement.classList.add('large');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600;1,9..144,800&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot" role="status">Loading…</div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="sr" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <noscript><p class="boot">This app needs JavaScript.</p></noscript>
</body>
</html>
